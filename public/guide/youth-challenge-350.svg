<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="480" height="180" fill="#ffffff"/>

  <!-- 묶음 표시: 출석으로 확정되는 270 / 조건이 더 붙는 80 -->
  <path d="M20 44 V38 H359.4 V44" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M359.4 44 V38 H460 V44" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="189.7" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">출석으로 확정 270만원</text>
  <text x="409.7" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">조건부 80만원</text>

  <!-- 350만원 한 줄. 폭이 곧 금액이다. 색상은 묶음, 명도는 개별 항목 -->
  <rect x="20"    y="56" width="314.3" height="40" fill="#0f766e"/>
  <rect x="334.3" y="56" width="25.1"  height="40" fill="#14b8a6"/>
  <rect x="359.4" y="56" width="37.7"  height="40" fill="#f59e0b"/>
  <rect x="397.1" y="56" width="62.9"  height="40" fill="#b45309"/>
  <text x="177"   y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">참여수당 250만원</text>
  <text x="428.5" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">50만원</text>

  <!-- 범례 -->
  <rect x="20"  y="120" width="13" height="13" fill="#0f766e"/>
  <text x="40"  y="131" font-size="14" fill="#374151">참여수당 250만원</text>
  <rect x="250" y="120" width="13" height="13" fill="#14b8a6"/>
  <text x="270" y="131" font-size="14" fill="#374151">이수 인센티브 20만원</text>
  <rect x="20"  y="148" width="13" height="13" fill="#f59e0b"/>
  <text x="40"  y="159" font-size="14" fill="#374151">구직활동 인센티브 30만원</text>
  <rect x="250" y="148" width="13" height="13" fill="#b45309"/>
  <text x="270" y="159" font-size="14" fill="#374151">취(창)업 인센티브 50만원</text>
</svg>
