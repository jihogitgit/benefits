<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <!-- 조건에 따라 더 받는 구간은 사선으로 둔다. 진한 칠로 이으면 누구나 그만큼 받는
         것으로 읽히는데, 실제로는 자녀 순서나 소득에 따라 갈린다. 규약대로 조건부는
         밀도로, 크기는 명도로 나눈다.
         선은 타일 가운데에 둔다 — x=0이면 선 굵기의 절반이 타일 밖으로 나가 잘린다. -->
    <pattern id="cond" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#0f766e" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="480" height="344" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#6b7280">지자체가 본인부담금 중 대신 내주는 비율 · 내몫 DB 접수 중 기준</text>

  <!-- 축은 '본인부담금 100% 중 몇 %를 지자체가 내주는가' 하나만 잰다. 금액이 아니라
       비율이라 유형이 달라도 같은 자로 잴 수 있다. 색은 짝 그림과 같다 —
       진한 #0f766e가 '남이 내는 몫'이다. -->

  <text x="20" y="62" font-size="12" fill="#111827">전남 화순군</text>
  <rect x="150" y="50" width="217.0" height="18" fill="#0f766e"/>
  <rect x="367.0" y="50" width="93.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="88" font-size="12" fill="#111827">전북 남원시</text>
  <rect x="150" y="76" width="310.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="114" font-size="12" fill="#111827">경상북도</text>
  <rect x="150" y="102" width="279.0" height="18" fill="#0f766e"/>
  <rect x="429.0" y="102" width="31.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="140" font-size="12" fill="#111827">전북 무주군</text>
  <rect x="150" y="128" width="279.0" height="18" fill="#0f766e"/>

  <text x="20" y="166" font-size="12" fill="#111827">전남 곡성군</text>
  <rect x="150" y="154" width="186.0" height="18" fill="#0f766e"/>
  <rect x="336.0" y="154" width="124.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="192" font-size="12" fill="#111827">경남 밀양시</text>
  <rect x="150" y="180" width="310.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="218" font-size="12" fill="#111827">충남 청양군</text>
  <rect x="150" y="206" width="124.0" height="18" fill="#0f766e"/>
  <rect x="274.0" y="206" width="186.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="244" font-size="12" fill="#111827">논산·홍성·태안·단양</text>
  <rect x="150" y="232" width="155.0" height="18" fill="#0f766e"/>

  <text x="20" y="270" font-size="12" fill="#111827">제주도</text>
  <rect x="150" y="258" width="62.0" height="18" fill="#0f766e"/>
  <rect x="212.0" y="258" width="62.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <text x="20" y="296" font-size="12" fill="#111827">경상남도</text>
  <rect x="150" y="284" width="31.0" height="18" fill="#0f766e"/>
  <rect x="181.0" y="284" width="93.0" height="18" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>

  <line x1="150" y1="308" x2="460" y2="308" stroke="#d1d5db" stroke-width="1"/>
  <text x="150" y="322" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="274" y="322" text-anchor="middle" font-size="11.5" fill="#6b7280">40</text>
  <text x="367" y="322" text-anchor="middle" font-size="11.5" fill="#6b7280">70</text>
  <text x="460" y="322" text-anchor="end" font-size="11.5" fill="#6b7280">100 (%)</text>

  <rect x="20" y="328" width="13" height="13" fill="#0f766e"/>
  <text x="40" y="339" font-size="12" fill="#374151">누구나 받는 몫</text>
  <rect x="140" y="328" width="13" height="13" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="160" y="339" font-size="12" fill="#374151">자녀 순서·소득에 따라 갈리는 몫</text>
</svg>
