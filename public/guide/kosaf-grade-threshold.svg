<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="480" height="230" fill="#ffffff"/>
  <text x="20" y="24" font-size="13.5" fill="#6b7280">공고문이 적은 성적 기준입니다. 성적 말고도 요건이 있습니다.</text>

  <text x="20"  y="52" font-size="14" font-weight="700" fill="#111827">국가장학금 Ⅰ유형</text>
  <text x="460" y="52" text-anchor="end" font-size="12.5" fill="#6b7280">소득 9구간 이하</text>
  <rect x="372.0" y="60" width="88.0" height="26" fill="#0f766e"/>
  <text x="364.0" y="78" text-anchor="end" font-size="13" font-weight="700" fill="#0f766e">80점 이상 <tspan font-weight="400" fill="#6b7280">· 직전학기</tspan></text>

  <text x="20"  y="112" font-size="14" font-weight="700" fill="#111827">희망사다리 Ⅰ(재학생) · Ⅱ(재직자)</text>
  <text x="460" y="112" text-anchor="end" font-size="12.5" fill="#6b7280">소득 요건 없음</text>
  <rect x="328.0" y="120" width="132.0" height="26" fill="#0f766e"/>
  <text x="320.0" y="138" text-anchor="end" font-size="13" font-weight="700" fill="#0f766e">70점 이상 <tspan font-weight="400" fill="#6b7280">· 직전학기</tspan></text>

  <line x1="20" y1="162" x2="460" y2="162" stroke="#9ca3af" stroke-width="1"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="20.0" y1="162" x2="20.0" y2="167"/>
    <line x1="328.0" y1="162" x2="328.0" y2="167"/>
    <line x1="372.0" y1="162" x2="372.0" y2="167"/>
    <line x1="460.0" y1="162" x2="460.0" y2="167"/>
  </g>
  <text x="20.0"   y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="328.0"  y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">70</text>
  <text x="372.0"  y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">80</text>
  <text x="460.0" y="181" text-anchor="end"    font-size="11.5" fill="#6b7280">100</text>

  <text x="240" y="204" text-anchor="middle" font-size="12" fill="#374151">국가장학금은 80점과 함께 <tspan font-weight="700">직전학기 12학점 이수</tspan>를 요구합니다.</text>
  <text x="240" y="222" text-anchor="middle" font-size="12" fill="#9ca3af">성적 기준에는 예외가 있습니다 — 본문 표를 함께 보세요.</text>
</svg>
