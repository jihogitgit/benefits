<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <!-- 70~80점 칸은 '일부에게만 열린다'는 뜻이다. 옅은 teal(#14b8a6)로 칠했다가 되돌렸다 —
         그 색은 kosaf-income-brackets.svg에서 '전원 해당, 금액이 적다'를 뜻하고 있어서,
         같은 색을 여기 쓰면 '적게 받는다'로 읽힌다. 두 뜻은 반대 축이다.
         조건부는 밀도(사선)로, 금액 차이는 명도로 갈라 둔다. -->
    <pattern id="conditional" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <!-- 타일 가운데에 둔다. x=0이면 선 굵기의 절반이 타일 밖으로 나가 잘리고,
           왼쪽 타일이 그 자리를 메워 주지도 않아 의도한 2.2px가 1.1px로 나온다. -->
      <line x1="3" y1="0" x2="3" y2="6" stroke="#0f766e" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="480" height="276" fill="#ffffff"/>
  <text x="20" y="24" font-size="13.5" fill="#6b7280">공고문이 적은 성적 기준입니다. 성적 말고도 요건이 있습니다.</text>

  <text x="20"  y="52" font-size="14" font-weight="700" fill="#111827">국가장학금 Ⅰ유형</text>
  <text x="460" y="52" text-anchor="end" font-size="12.5" fill="#6b7280">소득 9구간 이하</text>
  <rect x="328.0" y="60" width="44.0" height="26" fill="url(#conditional)" stroke="#0f766e" stroke-width="1"/>
  <rect x="372.0" y="60" width="88.0" height="26" fill="#0f766e"/>
  <text x="320.0" y="78" text-anchor="end" font-size="13" font-weight="700" fill="#0f766e">80점 이상 <tspan font-weight="400" fill="#6b7280">· 일부는 70점</tspan></text>

  <text x="20"  y="112" font-size="14" font-weight="700" fill="#111827">희망사다리 Ⅰ(재학생) · Ⅱ(재직자)</text>
  <text x="460" y="112" text-anchor="end" font-size="12.5" fill="#6b7280">소득 요건 없음</text>
  <rect x="328.0" y="120" width="132.0" height="26" fill="#0f766e"/>
  <text x="320.0" y="138" text-anchor="end" font-size="13" font-weight="700" fill="#0f766e">70점 이상 <tspan font-weight="400" fill="#6b7280">· 직전학기</tspan></text>

  <line x1="20" y1="162" x2="460" y2="162" stroke="#9ca3af" stroke-width="1"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="20.0" y1="162" x2="20.0" y2="167"/>
    <line x1="328.0" y1="162" x2="328.0" y2="167"/>
    <line x1="372.0" y1="162" x2="372.0" y2="167"/>
    <line x1="460.0" y1="162" x2="460.0" y2="167"/>
  </g>
  <text x="20.0"  y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="328.0" y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">70</text>
  <text x="372.0" y="181" text-anchor="middle" font-size="11.5" fill="#6b7280">80</text>
  <text x="460.0" y="181" text-anchor="end"    font-size="11.5" fill="#6b7280">100</text>

  <!-- '일반 기준은'으로 범위를 좁힌다. 예외 대상에게는 12학점 요구가 거짓이다. -->
  <text x="240" y="204" text-anchor="middle" font-size="12" fill="#374151">일반 기준은 80점과 함께 <tspan font-weight="700">직전학기 12학점 이수</tspan>입니다.</text>
  <text x="240" y="222" text-anchor="middle" font-size="12" fill="#9ca3af">사선 칸(70~80점)은 기초·차상위계층에게 열립니다.</text>
  <text x="240" y="240" text-anchor="middle" font-size="12" fill="#9ca3af">1~3구간도 경고 후 2회까지 이 구간에서 받을 수 있습니다.</text>
  <text x="240" y="258" text-anchor="middle" font-size="12" fill="#9ca3af">장애 대학생은 성적·이수학점, 자립준비청년은 성적 기준이 면제됩니다.</text>
</svg>
