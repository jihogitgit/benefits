<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <!-- 대구 추가분은 6개월 거주와 45세 미만이라는 조건이 붙는다. 진하게 이으면 누구나
         그 금액을 받는 것으로 읽히므로 규약대로 조건부는 밀도(사선)로 둔다.
         선은 타일 가운데에 둔다 — x=0이면 선 굵기의 절반이 타일 밖으로 나가 잘린다. -->
    <pattern id="cond" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#0f766e" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="480" height="210" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#6b7280">회당 최대 지원금 · 전국 기준과 대구형</text>

  <!-- 축은 '시술 1회에 최대 얼마'만 잰다. 세 시술이 같은 자로 재진다.
       0원 x=100, 180만원 x=425 → 1.8055556px/만원. 110→198.6 · 170→306.9 · 50→90.3 · 90→162.5 · 30→54.2 -->
  <text x="20" y="62" font-size="12.5" fill="#111827">신선배아</text>
  <rect x="100" y="48" width="198.6" height="20" fill="#0f766e"/>
  <rect x="298.6" y="48" width="108.3" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="413" y="63" font-size="12.5" font-weight="700" fill="#111827">170만원</text>

  <text x="20" y="98" font-size="12.5" fill="#111827">동결배아</text>
  <rect x="100" y="84" width="90.3" height="20" fill="#0f766e"/>
  <rect x="190.3" y="84" width="72.2" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="269" y="99" font-size="12.5" font-weight="700" fill="#111827">90만원</text>

  <text x="20" y="134" font-size="12.5" fill="#111827">인공수정</text>
  <rect x="100" y="120" width="54.2" height="20" fill="#0f766e"/>
  <text x="160" y="135" font-size="12.5" font-weight="700" fill="#111827">30만원</text>

  <line x1="100" y1="148" x2="425" y2="148" stroke="#d1d5db" stroke-width="1"/>
  <text x="100" y="162" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="190.3" y="162" text-anchor="middle" font-size="11.5" fill="#6b7280">50</text>
  <text x="280.6" y="162" text-anchor="middle" font-size="11.5" fill="#6b7280">100</text>
  <text x="370.8" y="162" text-anchor="middle" font-size="11.5" fill="#6b7280">150 (만원)</text>

  <rect x="20" y="180" width="13" height="13" fill="#0f766e"/>
  <text x="40" y="191" font-size="12" fill="#374151">전국 어디서나</text>
  <rect x="140" y="180" width="13" height="13" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="160" y="191" font-size="12" fill="#374151">대구 6개월 거주 · 45세 미만이면 더</text>
</svg>
