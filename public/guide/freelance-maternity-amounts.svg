<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="480" height="276" fill="#ffffff"/>
  <text x="20" y="24" font-size="13.5" fill="#6b7280">출산 1회 · 지급기간 90일 기준 · 2026년 고시액</text>

  <!-- 축은 세 줄에 같은 것을 재야 한다 — '출산 1회로 90일 동안 받는 총액'이다.
       근로자(출산전후휴가 급여)를 넣지 않은 이유가 이것이다. 대규모기업 소속이면
       앞 60일은 회사가 통상임금으로 주고 고용보험은 30일만 부담해, 받는 총액에
       회사 몫이 섞인다. 같은 축에 올리면 축이 두 가지를 재게 된다. -->

  <text x="20" y="52" font-size="13.5" font-weight="700" fill="#111827">고용보험 미적용 (정액)</text>
  <text x="460" y="52" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">150만원</text>
  <rect x="20" y="60" width="94.3" height="28" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>

  <text x="20" y="116" font-size="13.5" font-weight="700" fill="#111827">고용보험 가입 · 예술인</text>
  <text x="460" y="116" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">180만 ~ 660만원</text>
  <rect x="133.1" y="124" width="301.8" height="28" fill="#0f766e"/>

  <text x="20" y="180" font-size="13.5" font-weight="700" fill="#111827">고용보험 가입 · 노무제공자</text>
  <text x="460" y="180" text-anchor="end" font-size="13.5" font-weight="700" fill="#111827">240만 ~ 630만원</text>
  <rect x="170.9" y="188" width="245.1" height="28" fill="#0f766e"/>

  <!-- 150만원 세로 점선. 첫 줄 라벨 위에서 시작하면 글자를 뚫고 지나가므로 막대 바로 위에서 시작한다.
        이 그림의 주장이 이 선이다 — 아래 두 막대는 하한조차 선 오른쪽에서
       시작한다. 옅은 막대는 이 선에서 끝나므로 선이 곧 그 막대의 오른쪽 끝이다. -->
  <line x1="114.3" y1="58" x2="114.3" y2="228" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/>

  <line x1="20" y1="228" x2="460" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="244" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="114.3" y="244" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">150</text>
  <text x="208.6" y="244" text-anchor="middle" font-size="11.5" fill="#6b7280">300</text>
  <text x="302.9" y="244" text-anchor="middle" font-size="11.5" fill="#6b7280">450</text>
  <text x="397.1" y="244" text-anchor="middle" font-size="11.5" fill="#6b7280">600</text>
  <text x="460" y="244" text-anchor="end" font-size="11.5" fill="#6b7280">(만원)</text>

  <rect x="20" y="256" width="13" height="13" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <text x="40" y="267" font-size="12.5" fill="#374151">정액</text>
  <rect x="96" y="256" width="13" height="13" fill="#0f766e"/>
  <text x="116" y="267" font-size="12.5" fill="#374151">월평균보수에 따라 (하한 ~ 상한)</text>
</svg>
