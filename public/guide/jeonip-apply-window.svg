<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="480" height="220" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#6b7280">전입신고 후 몇 개월에 신청할 수 있나</text>

  <!-- 축은 '전입신고로부터 몇 개월'만 잰다. 세 사업이 같은 자로 재진다.
       0개월 x=150, 36개월 x=455 → 8.4722222px/개월.
       6개월 50.8 · 12개월 101.7 · 20개월 169.4 · 36개월 305.0
       옅은 칸은 아직 못 내고 기다리는 구간, 진한 칸은 낼 수 있는 구간이다.
       조건에 따라 갈리는 몫이 아니라 시간 순서라 사선을 쓰지 않았다. -->
  <text x="20" y="62" font-size="11.5" fill="#111827">화순 전입장려금</text>
  <rect x="150" y="48" width="169.4" height="20" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <rect x="319.4" y="48" width="135.6" height="20" fill="#0f766e"/>

  <text x="20" y="98" font-size="11.5" fill="#111827">화순 이사비용</text>
  <rect x="150" y="84" width="50.8" height="20" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <rect x="200.8" y="84" width="254.2" height="20" fill="#0f766e"/>

  <text x="20" y="134" font-size="11.5" fill="#111827">강진 전입장려금</text>
  <rect x="150" y="120" width="50.8" height="20" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <rect x="200.8" y="120" width="50.9" height="20" fill="#0f766e"/>

  <line x1="150" y1="150" x2="455" y2="150" stroke="#d1d5db" stroke-width="1"/>
  <text x="150" y="164" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="200.8" y="164" text-anchor="middle" font-size="11.5" fill="#6b7280">6</text>
  <text x="251.7" y="164" text-anchor="middle" font-size="11.5" fill="#6b7280">12</text>
  <text x="319.4" y="164" text-anchor="middle" font-size="11.5" fill="#6b7280">20</text>
  <text x="455" y="164" text-anchor="middle" font-size="11.5" fill="#6b7280">36 (개월)</text>

  <rect x="20" y="190" width="13" height="13" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
  <text x="40" y="201" font-size="12" fill="#374151">아직 못 냄</text>
  <rect x="140" y="190" width="13" height="13" fill="#0f766e"/>
  <text x="160" y="201" font-size="12" fill="#374151">신청할 수 있는 구간</text>
</svg>
