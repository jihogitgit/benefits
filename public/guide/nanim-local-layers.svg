<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <pattern id="cond" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#0f766e" stroke-width="2.2"/>
    </pattern>
  </defs>
  <rect width="480" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-size="13" fill="#6b7280">시술비 지원 밖에 있는 지자체 사업 · 최대 지원금</text>

  <!-- 다섯 줄 모두 사선이다. 짝 그림에서 사선은 '조건을 채워야 붙는 몫'이고, 이 다섯은
       사는 곳이 맞아야 존재한다 — 같은 뜻이므로 같은 칠을 쓴다. 진한 칠은 전국 공통을
       뜻하므로 여기에는 쓰지 않는다.
       축은 '한 건에 최대 얼마'만 잰다. 0원 x=160, 130만원 x=435 → 2.1153846px/만원. -->
  <text x="20" y="60" font-size="11.5" fill="#111827">서울 한방 첩약 (3개월)</text>
  <rect x="160" y="46" width="253.8" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="420" y="61" font-size="12" font-weight="700" fill="#111827">120만원</text>

  <text x="20" y="90" font-size="11.5" fill="#111827">경주 냉동난자 (회당)</text>
  <rect x="160" y="76" width="211.5" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="378" y="91" font-size="12" font-weight="700" fill="#111827">100만원</text>

  <text x="20" y="120" font-size="11.5" fill="#111827">전북 남성 난임 (회당)</text>
  <rect x="160" y="106" width="211.5" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="378" y="121" font-size="12" font-weight="700" fill="#111827">100만원</text>

  <text x="20" y="150" font-size="11.5" fill="#111827">경북 정계정맥류 (1회)</text>
  <rect x="160" y="136" width="211.5" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="378" y="151" font-size="12" font-weight="700" fill="#111827">100만원</text>

  <text x="20" y="180" font-size="11.5" fill="#111827">전북 검사비 (부부당)</text>
  <rect x="160" y="166" width="63.5" height="20" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="230" y="181" font-size="12" font-weight="700" fill="#111827">30만원</text>

  <line x1="160" y1="194" x2="435" y2="194" stroke="#d1d5db" stroke-width="1"/>
  <text x="160" y="208" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="265.8" y="208" text-anchor="middle" font-size="11.5" fill="#6b7280">50</text>
  <text x="371.5" y="208" text-anchor="middle" font-size="11.5" fill="#6b7280">100 (만원)</text>

  <rect x="20" y="222" width="13" height="13" fill="url(#cond)" stroke="#0f766e" stroke-width="1"/>
  <text x="40" y="233" font-size="12" fill="#374151">사는 곳에 그 사업이 있어야 받습니다</text>
</svg>
